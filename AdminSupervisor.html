<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المشرف — AE Academy</title>
  <style>
    :root{ --purple:#673ab7; --purple-600:#5e35b1; --red:#d32f2f; --red-700:#b71c1c; --bg:#f5f7fb; --card:#fff; --muted:#6b7280; }
    *{box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:#111;margin:0;padding:24px}
    .container{max-width:640px;margin:32px auto;background:var(--card);padding:28px;border-radius:14px;box-shadow:0 10px 28px rgba(16,24,40,.08)}
    h1{color:var(--purple);text-align:center;margin:0 0 8px}
    p.subtitle{text-align:center;color:#667085;margin:0 0 20px}
    .section{background:#fafafa;border:1px solid #eee;border-radius:12px;padding:18px;margin-bottom:14px}
    label{display:block;font-weight:600;margin-bottom:8px}
    input[type=email]{width:100%;padding:12px;border:1px solid #dadde3;border-radius:10px;font-size:15px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{appearance:none;border:0;border-radius:10px;padding:12px 16px;font-size:15px;cursor:pointer;color:#fff;background:var(--purple);transition:transform .05s ease, background .2s ease}
    button:hover{background:var(--purple-600)}
    button:active{transform:translateY(1px)}
    button.delete{background:var(--red)}
    button.delete:hover{background:var(--red-700)}
    .toast{margin-top:14px;padding:12px;border-radius:10px;display:none;word-break:break-word}
    .toast.ok{display:block;background:#e7f6ec;color:#1f7a3a;border:1px solid #b7e1c5}
    .toast.err{display:block;background:#fdecec;color:#b42318;border:1px solid #f3b1ab}
    .foot{margin-top:18px;font-size:.85rem;color:#98a2b3;text-align:center}
  </style>
</head>
<body>
  <div class="container">
    <h1>تحكم الأدمن — AE Academy</h1>
    <p class="subtitle">اكتب بريد المستخدم ثم اختر الإجراء</p>

    <div class="section">
      <label for="email">البريد الإلكتروني للمستخدم</label>
      <input id="email" type="email" placeholder="example@email.com" autocomplete="off" inputmode="email" />
      <div class="actions">
        <button id="btnReset" type="button">إعادة تعيين الجهاز</button>
        <button id="btnDelete" class="delete" type="button">حذف المستخدم</button>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <p class="foot">DR_Ahmed_Eisa ©AE Academy</p>
  </div>

  <script>
    const API_URL = "https://ae-academy.work/api";
    const ADMIN_KEY = "aYBsKx_Lfdw3Wz9r";

    const emailEl = document.getElementById('email');
    const toast = document.getElementById('toast');
    const btnReset = document.getElementById('btnReset');
    const btnDelete = document.getElementById('btnDelete');

    function show(msg, ok=true){
      toast.className = 'toast ' + (ok ? 'ok':'err');
      toast.textContent = msg;
    }
    function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

    async function call(endpoint, method, body){
      try{
        const res = await fetch(API_URL + endpoint, {
          method,
          headers: { 'Content-Type': 'application/json', 'X-Admin-API-Key': ADMIN_KEY },
          body: body ? JSON.stringify(body) : null
        });
        // بنعرض حالة عامة فقط بدون تفاصيل
        if(res.ok){ show('تم التنفيذ بنجاح ✔️', true); return true; }
        else { show('تعذر التنفيذ (تحقق من البريد/الصلاحيات).', false); return false; }
      } catch (e) {
        show('تعذر الاتصال بالـ API (CORS أو الشبكة).', false);
        return false;
      }
    }

    async function doReset(){
      const email = emailEl.value.trim();
      if(!validEmail(email)) return show('من فضلك أدخل بريد إلكتروني صحيح.', false);
      await call('/admin/reset_device','POST',{ email, password:'dummy', device_id:'dummy' });
    }
    async function doDelete(){
      const email = emailEl.value.trim();
      if(!validEmail(email)) return show('من فضلك أدخل بريد إلكتروني صحيح.', false);
      if(!confirm('هل أنت متأكد من الحذف؟')) return;
      await call(`/admin/users/${encodeURIComponent(email)}`,'DELETE');
    }

    btnReset.addEventListener('click', doReset);
    btnDelete.addEventListener('click', doDelete);
    emailEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doReset(); });
  </script>
</body>
</html>
