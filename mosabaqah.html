<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نتائج اختبارات مختصر التفسير الدكتور محمد حامد</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Fuse.js -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    html,body{height:100%}
    /* تمييز المسابقات الأربع كبطاقات */
    .comp-chip{
      border:1px solid rgb(229 231 235);
      background: linear-gradient(180deg,#f8fafc,#f1f5f9);
    }
    .comp-chip .lbl{ color:#334155 }
    .comp-chip .val{ font-weight:600; font-size:1.1rem }
    /* رأس ملوّن */
    .brandbar{ background:#4f46e5 } /* تقدر تغيّر اللون هنا */
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-full">

  <!-- عنوان ملوّن -->
  <div class="brandbar text-white">
    <div class="max-w-4xl mx-auto px-4 py-6 text-center">
      <h1 class="text-2xl sm:text-3xl font-bold">نتائج اختبارات مختصر التفسير الدكتور محمد حامد</h1>
    </div>
  </div>

  <main class="max-w-4xl mx-auto p-4 sm:p-6">

    <!-- سطر التعليمات (مركزي) -->
    <p class="text-sm text-gray-600 text-center mb-3">ابحث بالاسم أو رقم الجلوس (م)</p>

    <!-- شريط البحث + زر بحث -->
    <div class="flex gap-2 justify-center mb-4">
      <input id="q" type="search" placeholder="مثال: 1005 أو احمد علي"
             class="w-full max-w-xl rounded-2xl border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button id="searchBtn"
              class="shrink-0 rounded-2xl px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700">بحث</button>
    </div>

    <!-- رسالة/حالة -->
    <div id="msg" class="text-center text-sm text-gray-700 mb-4"></div>

    <!-- بطاقة نتيجة الطالب (رأسية صديقة للموبايل) -->
    <section id="card" class="hidden bg-white shadow rounded-2xl p-4 sm:p-5">
      <!-- الأساسيات -->
      <div id="kvBasics" class="grid gap-3 sm:grid-cols-2"></div>
      <!-- المسابقات الأربع بتصميم مميز -->
      <div id="kvComps" class="grid gap-3 sm:grid-cols-2 mt-4"></div>
      <!-- أي حقول إضافية يظهر هنا -->
      <div id="kvRest" class="grid gap-3 mt-4"></div>
    </section>

    <!-- قائمة ترشيحات متعددة -->
    <section id="candidates" class="hidden mt-3 bg-white rounded-2xl shadow divide-y"></section>

    <!-- المخطط العمودي -->
    <section id="chartWrapBar" class="hidden mt-6 bg-white rounded-2xl shadow p-4 sm:p-5">
      <h3 class="text-sm font-semibold text-gray-700 mb-3">درجاتك في المسابقات</h3>
      <canvas id="chartBar" height="140"></canvas>
    </section>

    <!-- مخطط الترند (خط زي البورصة) -->
    <section id="chartWrapLine" class="hidden mt-4 bg-white rounded-2xl shadow p-4 sm:p-5">
      <h3 class="text-sm font-semibold text-gray-700 mb-3">تغيّر المستوى عبر المسابقات </h3>
      <canvas id="chartLine" height="120"></canvas>
    </section>

    <!-- تذييل -->
    <footer class="mt-8 text-center text-xs text-gray-500">
      <a class="underline" href="https://t.me/Dr_Ahmed_Eisa" target="_blank" rel="noopener">Dveloper: Dr_Ahmed_Eisa</a>
    </footer>
  </main>

  <script>
    // أسماء الملفات
    const XLSX_PATH = 'mosabaqah.xlsx';
    const CSV_PATH  = 'mosabaqah.csv';

    // أعمدة محتملة
    const ID_COLS   = ['م','رقم الجلوس','A'];
    const NAME_COLS = ['الاسم','اسم','B'];

    // المسابقات الأربع (الترتيب المرغوب في الرسوم)
    const COMP_ORDER = ['الاحزاب','الزمر والسجدة','الاسراء','النور'];

    // تطبيع عربي قوي + قاعدة "عبد"
    const DIAC = /[\u0610-\u061A\u064B-\u065F\u06D6-\u06ED]/g;
    function normalizeArabicBase(s=''){
      return String(s)
        .replace(DIAC,'')
        .replace(/أ|إ|آ/g,'ا')
        .replace(/ى/g,'ي')
        .replace(/ؤ/g,'و')
        .replace(/ئ/g,'ي')
        .replace(/ة/g,'ه')
        .replace(/[^\u0621-\u063A\u0641-\u064A0-9 ]/g,' ')
        .replace(/\s+/g,' ')
        .trim().toLowerCase();
    }
    function normalizeForMatch(s=''){
      let n = normalizeArabicBase(s);
      n = n.replace(/\bعبد\s+ال/g,'عبدال');
      n = n.replace(/\bعبد\s+(?=[\u0621-\u064A])/g,'عبد');
      return n.replace(/\s+/g,''); // تجاهل المسافات
    }

    // حالة عامة
    let rows=[], cols=[], idCol=null, nameCol=null, fuse=null;
    let chartBar=null, chartLine=null;

    (async function init(){
      showMsg(''); hide('#card','#chartWrapBar','#chartWrapLine','#candidates');
      const ok = await tryLoadXlsx(XLSX_PATH) || await tryLoadCsv(CSV_PATH);
      if(!ok){ showMsg('لم يتم العثور على ملف النتائج.'); return; }
      detectKeyCols();
      fuse = new Fuse(rows, { includeScore:true, threshold:0.25, distance:60,
        keys:[{name:nameCol, getFn:(r)=> normalizeForMatch(r[nameCol])}]
      });
      bindUI();
    })();

    async function tryLoadXlsx(path){
      try{
        const r = await fetch(path,{cache:'no-store'}); if(!r.ok) return false;
        const buf = await r.arrayBuffer();
        const wb = XLSX.read(buf,{type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws,{defval:''});
        rows = data; cols = Object.keys(data[0]||{});
        return rows.length>0;
      }catch{ return false; }
    }
    async function tryLoadCsv(path){
      try{
        const r = await fetch(path,{cache:'no-store'}); if(!r.ok) return false;
        const text = await r.text();
        const data = csvToObjects(text);
        rows = data; cols = Object.keys(data[0]||{});
        return rows.length>0;
      }catch{ return false; }
    }
    function csvToObjects(csv){
      const lines = csv.split(/\r?\n/).filter(l=>l.trim().length>0);
      if(lines.length===0) return [];
      const headers = splitCsvLine(lines[0]).map(h=>h.trim());
      return lines.slice(1).map(line=>{
        const parts = splitCsvLine(line);
        const obj={}; headers.forEach((h,i)=> obj[h] = (parts[i]??'').trim());
        return obj;
      });
    }
    function splitCsvLine(line){
      const out=[], s=line; let cur='', inQ=false;
      for(let i=0;i<s.length;i++){
        const ch=s[i];
        if(ch==='"'){ if(inQ && s[i+1]==='"'){cur+='"'; i++;} else inQ=!inQ; }
        else if(ch===',' && !inQ){ out.push(cur); cur=''; }
        else { cur+=ch; }
      }
      out.push(cur); return out;
    }

    function detectKeyCols(){
      idCol   = ID_COLS.find(c=>cols.includes(c))   || cols[0];
      nameCol = NAME_COLS.find(c=>cols.includes(c)) || cols.find(c=>c!==idCol) || cols[1];
    }

    function bindUI(){
      document.getElementById('searchBtn').addEventListener('click', doSearch);
      document.getElementById('q').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSearch(); });
    }

    function doSearch(){
      const input = document.getElementById('q').value.trim();
      if(!input){ showMsg('من فضلك اكتب الاسم أو رقم الجلوس.'); hide('#card','#chartWrapBar','#chartWrapLine','#candidates'); return; }

      let matches=[];
      if(/^\d+$/.test(input)){ // رقم جلوس
        matches = rows.filter(r => String(r[idCol]??'').trim() === input);
        if(matches.length===0) matches = rows.filter(r => String(r[idCol]??'').trim().startsWith(input));
      }else{ // اسم
        const res = fuse.search(normalizeForMatch(input));
        matches = res.map(x=>x.item);
      }
      matches = matches.filter(hasAnyScore);

      if(matches.length===0){
        showMsg('لا توجد نتيجة مطابقة.'); hide('#card','#chartWrapBar','#chartWrapLine','#candidates');
      }else if(matches.length===1){
        renderStudent(matches[0]);
        showMsg('');
        hide('#candidates');
      }else{
        showCandidates(matches);
        showMsg('اختر الاسم الصحيح من القائمة.');
        hide('#card','#chartWrapBar','#chartWrapLine');
      }
    }

    function hasAnyScore(row){
      const exclude = new Set([idCol, nameCol, 'التقدير', 'متوسط النسبة', 'عدد المسابقات المشارَك فيها']);
      return cols.some(c => !exclude.has(c) && String(row[c]??'').toString().trim()!=='');
    }

    function fieldsForRow(row){
      // الأساسيات أولًا
      const basics = [];
      if(cols.includes(idCol)) basics.push(idCol);
      if(cols.includes(nameCol)) basics.push(nameCol);
      if(cols.includes('التقدير')) basics.push('التقدير');

      // النسبة — صياغة مخصوصة
      if(cols.includes('متوسط النسبة')) basics.push('متوسط النسبة');

      // مسابقات بترتيب محدد ثم الباقي غير الفارغ
      const comps = [];
      COMP_ORDER.forEach(c => { if(cols.includes(c) && String(row[c]).trim()!=='') comps.push(c); });
      const rest = cols.filter(c=>
          !basics.includes(c) && !COMP_ORDER.includes(c) &&
          c!=='عدد المسابقات المشارَك فيها' &&
          String(row[c]??'').trim()!==''
      );
      return { basics, comps, rest };
    }

    function formatValue(label, raw){
      // تنسيق خاص للنسبة: رقمين + %
      if(label.includes('النسبة')){
        const num = parseFloat(String(raw).replace(',', '.'));
        if(!isNaN(num)) return num.toFixed(2) + '%';
      }
      return String(raw ?? '');
    }

    function renderStudent(row){
      // املأ البطاقات
      const {basics, comps, rest} = fieldsForRow(row);

      const basicsBox = document.getElementById('kvBasics');
      const compsBox  = document.getElementById('kvComps');
      const restBox   = document.getElementById('kvRest');
      basicsBox.innerHTML=''; compsBox.innerHTML=''; restBox.innerHTML='';

      basics.forEach(label=>{
        basicsBox.appendChild(kvBlock(label, formatValue(label, row[label])));
      });

      comps.forEach(label=>{
        compsBox.appendChild(kvBlock(label, row[label], true)); // تصميم مميز
      });

      rest.forEach(label=>{
        restBox.appendChild(kvBlock(label, formatValue(label, row[label])));
      });

      show('#card');

      // جهّز بيانات الرسوم (المسابقات فقط وبالترتيب)
      const labels = []; const values = [];
      COMP_ORDER.forEach(c=>{
        if(comps.includes(c)){
          const v = parseFloat(String(row[c]).replace(',', '.'));
          if(!isNaN(v)){ labels.push(c); values.push(v); }
        }
      });

      // ارسم عمودي
      if(chartBar){ chartBar.destroy(); chartBar=null; }
      if(labels.length){
        const ctx1 = document.getElementById('chartBar').getContext('2d');
        chartBar = new Chart(ctx1, {
          type:'bar',
          data:{ labels, datasets:[{ label:'', data:values, borderWidth:1 }] },
          options:{ responsive:true, scales:{ y:{ beginAtZero:true, max:100 } }, plugins:{ legend:{ display:false } } }
        });
        show('#chartWrapBar');
      }else{
        hide('#chartWrapBar');
      }

      // ارسم خطّي (ترند) — بدون "عدد المسابقات"
      if(chartLine){ chartLine.destroy(); chartLine=null; }
      if(labels.length){
        const ctx2 = document.getElementById('chartLine').getContext('2d');
        chartLine = new Chart(ctx2, {
          type:'line',
          data:{ labels, datasets:[{ label:'', data:values, fill:false, tension:0.25, pointRadius:3 }] },
          options:{ responsive:true, scales:{ y:{ beginAtZero:true, max:100 } }, plugins:{ legend:{ display:false } } }
        });
        show('#chartWrapLine');
      }else{
        hide('#chartWrapLine');
      }
    }

    function kvBlock(label, value, isComp=false){
      const wrap = document.createElement('div');
      wrap.className = (isComp ? 'comp-chip ' : '') + 'rounded-2xl px-3 py-2';
      wrap.innerHTML = `
        <div class="lbl text-xs mb-1 ${isComp?'lbl':''}">${label}</div>
        <div class="val ${isComp?'val':''}">${value || '-'}</div>`;
      return wrap;
    }

    function showCandidates(list){
      const box = document.getElementById('candidates');
      box.innerHTML='';
      list.forEach(item=>{
        const id = String(item[idCol]??''); const nm = String(item[nameCol]??'');
        const btn = document.createElement('button');
        btn.type='button';
        btn.className='w-full text-right py-2 px-3 hover:bg-gray-50';
        btn.innerHTML = `<span class="font-semibold">${nm}</span> <span class="text-gray-500 text-xs">(${id})</span>`;
        btn.addEventListener('click', ()=>{ renderStudent(item); showMsg(''); hide('#candidates'); });
        box.appendChild(btn);
      });
      show('#candidates');
    }

    // أدوات عرض/إخفاء ورسائل
    function showMsg(t){ document.getElementById('msg').textContent = t || ''; }
    function show(sel){ document.querySelector(sel).classList.remove('hidden'); }
    function hide(...sels){ sels.forEach(s=> document.querySelector(s).classList.add('hidden')); }
  </script>
</body>
</html>
